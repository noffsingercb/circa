name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cache: npm requires a lockfile, which this repo lacked until
      # 2026-07-31. Both halves of that wait are now over: the cache is on,
      # and the install below is npm ci rather than npm install.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci, not npm install. install resolves ^ ranges fresh on every run,
      # so a transitive release could turn this job red without a single line
      # changing here -- and it would do so at the least convenient moment,
      # since nothing in the diff would explain it. ci installs the locked tree
      # exactly and errors if package-lock.json and package.json disagree,
      # which turns a silent drift into a loud, obvious failure.
      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      # A deliberately fake API origin. The build must not depend on a real one,
      # and giving it a recognisable value lets the assertion below prove that
      # the CSP is genuinely derived from this variable rather than from a
      # hardcoded string that happens to look right.
      - name: Build
        run: npm run build
        env:
          VITE_CIRCA_API: https://api.ci.invalid

      # The security headers only exist if the build generated them, and a build
      # that quietly skips that step ships a site with no CSP at all -- which is
      # invisible until somebody thinks to check response headers in production.
      # Assert it here, where it is cheap.
      - name: Assert security headers were generated
        run: |
          set -euo pipefail
          test -f build/_headers || {
            echo "::error::build/_headers is missing. Did scripts/gen-headers.mjs run?"
            exit 1
          }
          echo '--- build/_headers ---'
          cat build/_headers
          echo '----------------------'
          grep -q 'Content-Security-Policy:' build/_headers || {
            echo "::error::no Content-Security-Policy in build/_headers"
            exit 1
          }
          # connect-src must carry the origin from VITE_CIRCA_API. If this fails,
          # the CSP is not derived from the variable and will block the real API.
          grep -q 'https://api.ci.invalid' build/_headers || {
            echo "::error::connect-src does not reflect VITE_CIRCA_API"
            exit 1
          }
          grep -q "frame-ancestors 'none'" build/_headers || {
            echo "::error::site-wide frame-ancestors 'none' is missing"
            exit 1
          }
          grep -q 'frame-ancestors \*' build/_headers || {
            echo "::error::/embed must stay framable -- frame-ancestors * is missing"
            exit 1
          }
          # THE ONE THAT ACTUALLY MATTERS FOR FRAMING.
          #
          # Cloudflare Pages applies every matching rule and concatenates the
          # results -- a more specific rule does not override a broader one.
          # Measured on preview af71183d: GET /embed returned TWO
          # Content-Security-Policy headers, one per matching rule. Under CSP,
          # multiple policies are each enforced independently and content must
          # satisfy all of them, so 'none' and * intersected to 'none' and the
          # embed was silently unframable.
          #
          # The two greps above both PASSED on that broken file, which is the
          # whole reason this check exists. The detach line is what guarantees
          # /embed's policy is the only one on the response.
          grep -q '^  ! Content-Security-Policy$' build/_headers || {
            echo "::error::/embed does not detach the inherited CSP. Two policies will intersect and framing will break."
            exit 1
          }
          # Shared headers belong under /* only, and are inherited. Repeating
          # them per-rule duplicated every one of them on /embed and produced a
          # malformed comma-joined Strict-Transport-Security value.
          for header in Strict-Transport-Security Cross-Origin-Opener-Policy Referrer-Policy X-Content-Type-Options Permissions-Policy; do
            count=$(grep -c "^  ${header}:" build/_headers || true)
            if [ "$count" -ne 1 ]; then
              echo "::error::${header} appears ${count} times in build/_headers; expected exactly 1 (set it under /* and let it inherit)"
              exit 1
            fi
          done
          # 'unsafe-inline' in script-src would silently undo the policy's main
          # purpose. style-src legitimately has it; script-src must not.
          if grep -q "script-src[^;]*unsafe-inline" build/_headers; then
            echo "::error::script-src contains 'unsafe-inline'"
            exit 1
          fi
          echo "build/_headers looks right."

      # THE ONE THAT ACTUALLY MATTERS FOR THE PAGE RENDERING AT ALL.
      #
      # Every assertion above passed on the build that served a blank page in
      # production. They check the shape of the headers; none of them can detect
      # a policy that forbids the script which starts the application.
      # script-src 'self' refused SvelteKit's inline bootstrap, hydration never
      # ran, and the only visible symptom was an empty document.
      #
      # This step reads the built HTML the policy will actually govern and fails
      # if any inline script in it is missing from any generated policy -- so it
      # fails on the artifact that shipped, not on a description of it.
      - name: Assert every inline script is hashed in the CSP
        run: node scripts/check-inline-hashes.mjs
